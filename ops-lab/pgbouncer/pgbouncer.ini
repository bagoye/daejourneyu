; PgBouncer 실습 설정 — Supabase가 앞단에 두는 트랜잭션 풀러(6543)와 같은 모드.
[databases]
; 기본: 트랜잭션 모드 — 트랜잭션이 끝나면 서버 연결을 다른 클라이언트에게 돌려준다
daejourneyu = host=db port=5432 dbname=daejourneyu
; 비교용: 세션 모드 — 클라이언트가 연결을 끊을 때까지 서버 연결을 붙잡는다(Supabase 5432 세션 풀러에 해당)
daejourneyu_session = host=db port=5432 dbname=daejourneyu pool_mode=session
; 통합 테스트를 풀러 뒤에서 돌리기 위한 전용 DB(테스트가 TRUNCATE하므로 실습 데이터와 분리)
daejourneyu_it = host=db port=5432 dbname=daejourneyu_it

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
pool_mode = transaction
; DB 쪽 서버 연결은 데이터베이스·사용자 조합당 최대 20개
default_pool_size = 20
; 클라이언트 연결은 1000개까지 받는다(대기열에서 서버 연결을 기다림)
max_client_conn = 1000
; 서버 연결을 기다리는 클라이언트를 이 시간(초) 후 끊는다
query_wait_timeout = 30
; 일부 드라이버가 보내는 시작 파라미터 무시
ignore_startup_parameters = extra_float_digits
log_connections = 0
log_disconnections = 0
