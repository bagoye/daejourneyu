# 실습이라 수집·평가 간격을 짧게(5초) 잡았다. 운영 권장: scrape 15~30초, 알림 for 1~5분(04·09 문서 참고).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: postgres
    static_configs:
      - targets: ["exporter-primary:9187"]
        labels: { role: primary }
      - targets: ["exporter-standby:9187"]
        labels: { role: standby }
