# 알림 규칙 — 각 규칙은 이 프로젝트의 앞선 실습에서 실제로 재현한 장애에 대응한다.
# 실습용으로 for를 짧게(10초) 두었다. 운영에서는 순간 튐에 울리지 않게 1~5분으로 늘린다.
groups:
  - name: postgres
    rules:
      - alert: PostgresDown
        # pg_up == 0만으로는 부족했다: DB가 완전히 죽으면 exporter의 접속 시도가 수집 제한 시간(5초)을 넘겨 수집 자체가
        # 실패하고(up = 0), pg_up 시계열이 끊겨 알림이 pending에서 계속 리셋됐다(09 문서). 수집 실패도 다운으로 본다.
        expr: pg_up == 0 or up{job="postgres"} == 0
        for: 10s
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.role }} DB에 접속할 수 없다"
          runbook: "장애 전환 절차 — docs/db-optimization/07 §4"

      - alert: ConnectionsNearLimit
        # 3차 실습: max_connections를 넘자 'too many clients' + 모니터링 접속까지 실패(08 §3)
        expr: sum by (role) (pg_stat_activity_count) / max by (role) (pg_settings_max_connections) > 0.8
        for: 10s
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.role }} 연결 사용률 {{ $value | humanizePercentage }}"
          runbook: "풀러 pool_size·앱 connection_limit 확인 — docs/db-optimization/04 §1, 08 §3"

      - alert: DeadlockDetected
        # 1차 작업: 담기 취소↔코스 삭제, PATCH↔DELETE 교착을 재현·수정(02)
        expr: increase(pg_stat_database_deadlocks{datname="daejourneyu"}[1m]) > 0
        labels: { severity: warning }
        annotations:
          summary: "교착 발생 {{ $value }}건(1분)"
          runbook: "서버 로그의 deadlock detected → 잠금 순서 점검 — docs/db-optimization/02"

      - alert: WalArchiveFailing
        # PITR 실습: 보관이 멈추면 WAL이 pg_wal에 쌓여 DB 디스크가 찬다(06 §5)
        expr: increase(pg_archiver_failed_count[1m]) > 0
        labels: { severity: critical }
        annotations:
          summary: "WAL 보관 실패 {{ $value }}회(1분) — 복구 가능 구간이 멈췄다"
          runbook: "archive_command·보관소 디스크 확인 — docs/db-optimization/06"

      - alert: ReplicationLagHigh
        # 복제 실습: 비동기 지연만큼 장애 전환 시 유실(07 §4)
        expr: max by (application_name) (pg_replication_sender_replay_lag_bytes) > 8 * 1024 * 1024
        for: 10s
        labels: { severity: warning }
        annotations:
          summary: "standby {{ $labels.application_name }} 재생 지연 {{ $value | humanize1024 }}B"
          runbook: "standby 부하·네트워크·replay 일시정지 확인 — docs/db-optimization/07"

      - alert: LongRunningTransaction
        # 오래 열린 트랜잭션은 VACUUM을 막아 테이블이 부풀고, 잠금을 쥐면 다른 쓰기를 막는다.
        # exporter 내장 지표(pg_long_running_transactions_oldest_timestamp_seconds)는 처음엔 "경과 초"로 오해해 오탐이 났고,
        # time() - 지표로 고친 뒤엔 실제 14초짜리 트랜잭션을 1.2초로 보여 감지하지 못했다 → xact_start로 직접 계산한 지표를 쓴다.
        expr: pg_xact_oldest_seconds > 30
        for: 10s
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.role }}에서 {{ $value | humanizeDuration }} 동안 열린 트랜잭션"
          runbook: "pg_stat_activity에서 xact_start가 오래된 세션 확인 후 종료 판단"
